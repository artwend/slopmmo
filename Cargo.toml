[workspace]
resolver = "3"
members = [
    "crates/shared",
    "crates/proto",
    "crates/net",
    "crates/sim",
    "crates/kcc-avian",
    "crates/server",
    "crates/client",
    "tools/packetdump",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
proto = { path = "crates/proto" }
net = { path = "crates/net" }
sim = { path = "crates/sim" }
kcc-avian = { path = "crates/kcc-avian" }
shared = { path = "crates/shared" }
serde = { version = "1", default-features = false, features = [
  "alloc",
  "derive",
] }
lightyear = { version = "0.31", features = [
  "interpolation",
  "prediction",
  "replication",
  "input_native",
] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
