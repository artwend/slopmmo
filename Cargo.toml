[workspace]
resolver = "3"
members = [
    "crates/shared",
    "crates/kcc",
    "crates/server",
    "crates/client",
    "crates/protocol-inspector",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
kcc = { path = "crates/kcc" }
shared = { path = "crates/shared" }
serde = { version = "1", default-features = false, features = [
  "alloc",
  "derive",
] }

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
