[workspace]
resolver = "3"
members = ["crates/proto", "crates/sim", "crates/server", "crates/client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
proto = { path = "crates/proto" }
sim = { path = "crates/sim" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
