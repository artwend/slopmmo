[package]
name = "shared"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bevy = { version = "0.20", default-features = false, features = [
  "default_app",
  "bevy_curve",
] }
lightyear = { "workspace" = true, features = [
  "interpolation",
  "prediction",
  "replication",
  "input_bei",
] }
serde.workspace = true
bevy_enhanced_input = { version = "0.27", default-features = false, features = [
  "serialize",
] }

[dev-dependencies]
postcard = { version = "1", features = ["alloc"] }

