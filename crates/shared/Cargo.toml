[package]
name = "shared"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bevy = { version = "0.20", default-features = false, features = [
  "default_app",
  "bevy_curve",
] }
bevy_math = "0.20"
# `Aabb3d` moved out of `bevy_math` in 0.20. Default features would only add `rand`.
bevy_shape = { version = "0.20", default-features = false, features = ["std"] }
kcc.workspace = true
serde.workspace = true
lightyear = { version = "0.31", default-features = false, features = [
  "std",
  "client",
  "server",
  "replication",
  "prediction",
  "interpolation",
  "input_bei",
  "avian3d",
] }
bevy_enhanced_input = { version = "0.27", default-features = false, features = [
  "serialize",
] }
