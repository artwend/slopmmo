[package]
name = "net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
proto.workspace = true
bevy_app = "0.20"

# The protocol crate needs neither role: channels and messages are declared with
# transport-level APIs only. The two binaries add `client` / `server` themselves,
# so cargo's feature unification no longer links both halves into both binaries.
lightyear = { version = "0.31", default-features = false, features = ["std"] }

[dev-dependencies]
postcard = { version = "1", features = ["alloc"] }
