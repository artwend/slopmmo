[package]
name = "server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
shared.workspace = true
net.workspace = true
bevy_math = "0.20"
clap = { version = "4", features = ["derive"] }
sim.workspace = true

# Headless only: no render, no window, no asset pipeline.
bevy = { version = "0.20", default-features = false, features = ["std", "multi_threaded", "async_executor", "bevy_log"] }

lightyear = { version = "0.31", default-features = false, features = ["std", "client", "server", "udp", "raw_connection"] }

bevy_enhanced_input = { version = "0.27", default-features = false, features = [
  "serialize",
] }