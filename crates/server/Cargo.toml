[package]
name = "server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
shared.workspace = true
clap = { version = "4", features = ["derive"] }

# Headless only: no render, no window, no asset pipeline. The input, state and
# transform plugins are what lightyear's replication and the physics pipeline
# expect to find in the app.
bevy = { version = "0.20", default-features = false, features = [
  "std",
  "multi_threaded",
  "async_executor",
  "bevy_log",
  "bevy_state",
] }

# The server half of the raw connection imports client-side lifecycle types, so
# `client` is required together with `server`.
lightyear = { version = "0.31", default-features = false, features = [
  "std",
  "client",
  "server",
  "udp",
  "raw_connection",
  "replication",
  "prediction",
  "interpolation",
  "input_bei",
  "avian3d",
] }
