[package]
name = "proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Lightyear serialises these types with postcard; the layout is defined by the
# derives in `src/packet.rs`.
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }

[dev-dependencies]
# The round-trip tests use the same codec Lightyear does.
postcard = { version = "1", features = ["alloc"] }

