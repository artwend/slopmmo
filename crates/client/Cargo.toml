[package]
name = "client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
proto.workspace = true
net.workspace = true
sim.workspace = true
bevy = "0.20"

# No `udp` feature on a wasm target: lightyear's UDP backend is std-only.
lightyear = { version = "0.31", default-features = false, features = ["std", "client", "udp", "raw_connection"] }
