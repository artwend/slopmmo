[package]
name = "client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
shared.workspace = true
kcc.workspace = true
# The windowed client is the only crate that renders, so it is the only one that
# pulls in the render stack. `3d` bundles the PBR/camera pipeline, the windowing
# platform (winit, gamepad) and the scene/asset plugins the headless mode also
# registers.
bevy = { workspace = true, features = [
  "3d",
] }
clap = { version = "4", features = ["derive"] }

# No `udp` feature on a wasm target: lightyear's UDP backend is std-only.
lightyear = { version = "0.31", default-features = false, features = [
  "std",
  "client",
  "udp",
  "raw_connection",
  "replication",
  "prediction",
  "interpolation",
  "input_bei",
  "avian3d",
] }
