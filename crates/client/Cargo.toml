[package]
name = "client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
shared.workspace = true
sim.workspace = true
kcc-avian.workspace = true
bevy = "0.20"
clap = { version = "4", features = ["derive"] }

# No `udp` feature on a wasm target: lightyear's UDP backend is std-only.
lightyear = { version = "0.31", default-features = false, features = [
  "std",
  "client",
  "udp",
  "raw_connection",
  "replication",
  "prediction",
  "interpolation",
  "input_bei",
  "avian3d",
] }
