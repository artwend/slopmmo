[package]
name = "packetdump"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Developer tool: it is in the workspace so `cargo test --workspace` covers it,
# but it is never published and no shipped crate depends on it.
publish = false
description = "Developer-only CLI packet analyzer for the lightyear movement protocol"

[dependencies]
proto.workspace = true
# Command line parsing and `--help`.
clap = { version = "4", features = ["derive"] }
# Decodes the message payloads. Lightyear serializes registered messages with
# postcard; the framing itself is parsed in `src/wire.rs`.
postcard = { version = "1", features = ["alloc"] }
# RON is the console representation of decoded packet content.
ron = "0.12"
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
# Reads the display filter from `packetdump.toml`.
toml = "1"

[dev-dependencies]
# `src/wire.rs` is a hand-written restatement of lightyear's packet layout. This
# dependency exists so a test can push a payload through the real transport and
# parse the resulting datagram: when lightyear changes the framing, that test is
# the tripwire instead of the tool silently decoding nonsense.
lightyear = { version = "0.31", default-features = false, features = ["std"] }
bevy_app = "0.20"
